name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A syntax error here reaches every installed copy through self-update.
      - run: |
          for f in .claude-plugin/marketplace.json \
                   skills/*/.claude-plugin/plugin.json \
                   skills/*/hooks/hooks.json; do
            jq empty "$f" && echo "ok  $f"
          done

  # The hooks run on whatever the user has: BSD tools on macOS, GNU on Linux.
  hooks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-hooks.sh

  # A rule edited in the skill and not rebuilt leaves Cursor and ChatGPT on
  # the old text, which is worse than having no port at all.
  ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-ports.sh --check

  bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - run: bash scripts/check-bump.sh origin/main
