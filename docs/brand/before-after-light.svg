  <g>
    <text class="b" style="animation-delay:0.35s" x="92" y="256" textLength="490.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A few things commonly make a login endpoint</text>
    <text class="b" style="animation-delay:0.42s" x="92" y="289" textLength="501.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">slow. The password hash is the usual suspect</text>
    <text class="b" style="animation-delay:0.49s" x="92" y="322" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">— if bcrypt is configured with a high cost</text>
    <text class="b" style="animation-delay:0.56s" x="92" y="355" textLength="501.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">factor, that alone can dominate the request.</text>
    <text class="b" style="animation-delay:0.63s" x="92" y="388" textLength="501.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Beyond that, it’s worth checking whether the</text>
    <text class="b" style="animation-delay:0.7s" x="92" y="421" textLength="501.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">user lookup is hitting an index, whether the</text>
    <text class="b" style="animation-delay:0.77s" x="92" y="454" textLength="467.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">session write is in the same transaction,</text>
    <text class="b" style="animation-delay:0.84s" x="92" y="487" textLength="79.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">and […]</text>
  </g>
  <g>
    <text class="a" style="animation-delay:1.25s" x="692" y="256" textLength="387.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="lead">It isn’t.</tspan> <tspan class="val">/auth/login</tspan> is <tspan class="val">84 ms</tspan> p95</text>
    <text class="a" style="animation-delay:1.41s" x="692" y="289" textLength="399" lengthAdjust="spacingAndGlyphs" xml:space="preserve">over the last 24 h; the slow one is</text>
    <text class="a" style="animation-delay:1.57s" x="692" y="322" textLength="501.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="val">/auth/refresh</tspan> at <tspan class="val">2.1 s</tspan>, and the PWA calls it</text>
    <text class="a" style="animation-delay:1.73s" x="692" y="355" textLength="410.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">on every app resume, which is almost</text>
    <text class="a" style="animation-delay:1.89s" x="692" y="388" textLength="342" lengthAdjust="spacingAndGlyphs" xml:space="preserve">certainly what you’re feeling.</text>
    
    <text class="a" style="animation-delay:2.21s" x="692" y="454" textLength="319.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Want me to dig into refresh?</text>
