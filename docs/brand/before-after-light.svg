<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">why is the login endpoint so slow?</title>
  <desc id="d">WITHOUT 74 WORDS: A few things commonly make a login endpoint slow. The password hash is the usual suspect — if bcrypt is configured with a high cost factor, that alone can dominate the request. Beyond that, it’s worth checking whether the user lookup is hitting an index, whether the session write is in the same transaction, and […] WITH concise. 3 SENTENCES: It isn’t. /auth/login is 84 ms p95 over the last 24 h; the slow one is /auth/refresh at 2.1 s, and the PWA calls it on every app resume, which is almost certainly what you’re feeling.  Want me to dig into refresh?</desc>
