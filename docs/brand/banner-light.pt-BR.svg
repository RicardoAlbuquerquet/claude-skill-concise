<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 1280 328" width="1280" height="328" role="img" aria-labelledby="t">
  <title id="t">concise. — A resposta na primeira frase.</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.4" fill="#0F0F12"/></pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%" gradientTransform="translate(0.5 0.5) scale(1 0.62) translate(-0.5 -0.5)">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hole" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".025" stop-color="#fff" stop-opacity=".5"/><stop offset=".06" stop-color="#fff"/><stop offset=".94" stop-color="#fff"/><stop offset=".975" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m-grid"><rect width="1280" height="440" fill="url(#fade)"/></mask>
    <mask id="m-ghost"><rect width="1280" height="440" fill="url(#hole)"/></mask>
  </defs>
  <style>
    .grid { opacity: 0.16; }
    .g text { font: 400 19px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #0F0F12; }
    .g { opacity: .3; animation: ghost 1.8s cubic-bezier(.2,.7,.2,1) both; }
    .k { fill: none; stroke: #EE4A1F; stroke-width: 2; stroke-linecap: round; opacity: .75; animation: strike .55s cubic-bezier(.7,0,.25,1) both; }
    .s { fill: none; stroke: #0F0F12; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; animation: draw .8s cubic-bezier(.45,.05,.25,1) both; }
    .tittle { fill: #0F0F12; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
    .period { fill: #EE4A1F; transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.8,.64,1) both; }
    .eyebrow { font: 600 13px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 4.2px; fill: #5C626C; animation: rise .7s ease-out .1s both; }
    .rule { stroke: #5C626C; stroke-width: 1; opacity: .45; animation: rise .7s ease-out .1s both; }
    .tag { font: 500 25px -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #5C626C; animation: rise .8s cubic-bezier(.2,.7,.2,1) 2.15s both; }
    @keyframes ghost { 0% { opacity: 0; transform: translateY(8px); } 30% { opacity: .62; transform: none; } 62% { opacity: .62; } 100% { opacity: .3; } }
    @keyframes strike { 0% { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; } 1% { opacity: .75; } 100% { stroke-dasharray: 1; stroke-dashoffset: 0; } }
    @keyframes draw { 0% { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } 100% { stroke-dasharray: 1; stroke-dashoffset: 0; } }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="grid" width="1280" height="440" fill="url(#dots)" mask="url(#m-grid)"/>
  <g mask="url(#m-ghost)">
    <g class="g" style="animation-delay:0.15s">
      <text x="125" y="132" textLength="171" lengthAdjust="spacingAndGlyphs">Ótima pergunta!</text>
      <path class="k" style="animation-delay:0.75s" pathLength="1" d="M121 126.5H300"/>
    </g>
    <g class="g" style="animation-delay:0.21s">
      <text x="45.4" y="196" textLength="216.6" lengthAdjust="spacingAndGlyphs">Vou dar uma olhada…</text>
      <path class="k" style="animation-delay:0.82s" pathLength="1" d="M41.4 190.5H266"/>
    </g>
    <g class="g" style="animation-delay:0.27s">
      <text x="60.6" y="260" textLength="239.4" lengthAdjust="spacingAndGlyphs">Vale a pena notar que</text>
      <path class="k" style="animation-delay:0.89s" pathLength="1" d="M56.6 254.5H304"/>
    </g>
    <g class="g" style="animation-delay:0.33s">
      <text x="136" y="324" textLength="114" lengthAdjust="spacingAndGlyphs">Em resumo,</text>
      <path class="k" style="animation-delay:0.96s" pathLength="1" d="M132 318.5H254"/>
    </g>
    <g class="g" style="animation-delay:0.39s">
      <text x="996" y="132" textLength="182.4" lengthAdjust="spacingAndGlyphs">Segue um resumo:</text>
      <path class="k" style="animation-delay:1.03s" pathLength="1" d="M992 126.5H1182.4"/>
    </g>
    <g class="g" style="animation-delay:0.45s">
      <text x="1024" y="196" textLength="193.8" lengthAdjust="spacingAndGlyphs">Espero que ajude!</text>
      <path class="k" style="animation-delay:1.1s" pathLength="1" d="M1020 190.5H1221.8"/>
    </g>
    <g class="g" style="animation-delay:0.51s">
      <text x="990" y="260" textLength="205.2" lengthAdjust="spacingAndGlyphs">Fico à disposição!</text>
      <path class="k" style="animation-delay:1.17s" pathLength="1" d="M986 254.5H1199.2"/>
    </g>
    <g class="g" style="animation-delay:0.57s">
      <text x="1036" y="324" textLength="159.6" lengthAdjust="spacingAndGlyphs">## Visão geral</text>
      <path class="k" style="animation-delay:1.24s" pathLength="1" d="M1032 318.5H1199.6"/>
    </g>
  </g>
  <path class="rule" d="M378 84H478M802 84H902"/>
  <text class="eyebrow" x="640" y="89" text-anchor="middle">UM PLUGIN PARA CLAUDE CODE</text>
  <g transform="translate(338 170) scale(0.87)">
    <path class="s" style="animation-delay:1.05s" pathLength="1" d="M81.02 19.43A42.5 42.5 0 1 0 81.02 80.57"/>
    <path class="s" style="animation-delay:1.13s" pathLength="1" d="M150.52 7.5A42.5 42.5 0 1 0 150.52 92.5A42.5 42.5 0 1 0 150.52 7.5"/>
    <path class="s" style="animation-delay:1.2s" pathLength="1" d="M228.02 9V91"/>
    <path class="s" style="animation-delay:1.32s" pathLength="1" d="M228.02 54V50A41.5 41.5 0 0 1 311.02 50V91"/>
    <path class="s" style="animation-delay:1.27s" pathLength="1" d="M418.04 19.43A42.5 42.5 0 1 0 418.04 80.57"/>
    <path class="s" style="animation-delay:1.35s" pathLength="1" d="M450.04 9V91"/>
    <path class="s" style="animation-delay:1.43s" pathLength="1" d="M540.04 20.5C534.04 11.5 525.04 8.5 513.04 8.5C496.04 8.5 484.04 16.5 484.04 29.5C484.04 44.5 499.04 45 513.04 50C528.04 55 543.04 55.5 543.04 71.5C543.04 84.5 530.04 91.5 513.04 91.5C501.04 91.5 490.04 87.5 484.04 79.5"/>
    <path class="s" style="animation-delay:1.5s" pathLength="1" d="M574.04 50H659.04A42.5 42.5 0 1 0 649.1 77.32"/>
    <circle class="tittle" style="animation-delay:1.8s" cx="450.04" cy="-31" r="11.5"/>
    <circle class="period" style="animation-delay:2.13s" cx="679.6" cy="88.5" r="12.5"/>
  </g>
  <text class="tag" x="640" y="335.27" text-anchor="middle">A resposta na primeira frase.</text>
</svg>
